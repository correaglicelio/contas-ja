# Contas Já: roda a coleta na hora (aba Actions > "Coletar repasses agora" > Run workflow).
name: Coletar repasses agora

on:
  workflow_dispatch:
    inputs:
      uf:
        description: "Estados (MT, MT,GO ou todas)"
        default: "MT"

permissions:
  contents: write

concurrency:
  group: contas-ja-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repasses federais (Portal da Transparência)
        run: python scripts/coletar_repasses.py --uf "${{ inputs.uf }}"
      - name: Salvar dados no repositório
        run: |
          git config user.name "contas-ja-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Dados: repasses ($(date -u +%d/%m/%Y))"
          git pull --rebase --strategy-option=theirs origin main || true
          git push
